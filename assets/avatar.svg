<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070f3"/>
      <stop offset="50%" stop-color="#00dfd8"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="80" cy="80" r="72" fill="#0070f3" opacity="0.15" filter="url(#subtleGlow)"/>

  <!-- Outer Gradient Border -->
  <circle cx="80" cy="80" r="74" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.85"/>

  <!-- Base Circle -->
  <circle cx="80" cy="80" r="71" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="20" y1="50" x2="140" y2="50"/>
    <line x1="20" y1="80" x2="140" y2="80"/>
    <line x1="20" y1="110" x2="140" y2="110"/>
    <line x1="50" y1="20" x2="50" y2="140"/>
    <line x1="80" y1="20" x2="80" y2="140"/>
    <line x1="110" y1="20" x2="110" y2="140"/>
  </g>

  <!-- Monogram Initials SP -->
  <text x="80" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Inter', system-ui, sans-serif" font-size="44" font-weight="700" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-2">SP</text>

  <!-- Online / Live Dot -->
  <circle cx="126" cy="126" r="10" fill="#09090b"/>
  <circle cx="126" cy="126" r="7" fill="#10b981"/>
  <circle cx="126" cy="126" r="12" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="7;14;7" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>

